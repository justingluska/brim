name: Brim
options:
  bundleIdPrefix: com.gluska
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Supplied from the environment so no team lives in the repo:
    #   DEVELOPMENT_TEAM=ABCDE12345 xcodegen generate
    # Xcode Cloud provides it through CI_TEAM_ID (see ci_scripts). Left unset,
    # pick a team in Xcode under Signing & Capabilities.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  CapKit:
    path: Packages/CapKit

schemes:
  Brim:
    build:
      targets:
        Brim: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: BrimTests
        - name: BrimUITests
        - package: CapKit/CapKitTests

targets:
  Brim:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Brim
    dependencies:
      - package: CapKit
    info:
      path: Brim/Info.plist
      properties:
        CFBundleDisplayName: Brim
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad apps with multitasking must declare all four (ITMS-90474).
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Keeps audio (and Picture in Picture) running when the app is backgrounded.
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gluska.brim
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  BrimTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BrimTests
    dependencies:
      - target: Brim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gluska.brim.tests
        GENERATE_INFOPLIST_FILE: YES

  # Drives the built-in demo library and attaches screenshots to the results.
  BrimUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BrimUITests
    dependencies:
      - target: Brim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gluska.brim.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Brim
